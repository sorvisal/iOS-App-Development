
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>My First Ionic App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Welcome to Ionic Angular!</h1>

  <h2>Counter: {{ count }}</h2>

  <ion-button expand="block" (click)="increment()">
    + Increase
  </ion-button>

  <ion-button expand="block" color="warning" (click)="decrement()">
    - Decrease
  </ion-button>

  <ion-button expand="block" color="danger" (click)="reset()">
    Reset
  </ion-button>

</ion-content>
